<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Bhai Mail - kinkbss.abrdns.com</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* ফুল উইডথ অ্যাড সেকশন (কন্টেইনারের বাইরে উপরে) */
        .top-ad-wrapper { width: 100%; max-width: 728px; min-height: 90px; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; background: rgba(15, 23, 42, 0.9); padding: 5px; border-radius: 8px; border: 1px dashed #334155; overflow: hidden; }

        .container { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 100%; max-width: 500px; }
        h1 { text-align: center; margin-bottom: 15px; font-size: 24px; color: #38bdf8; font-weight: 700; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .email-box { display: flex; background: #0f172a; border: 1px solid #475569; border-radius: 10px; overflow: hidden; }
        input[type="text"] { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; font-size: 15px; outline: none; min-width: 0; }
        .domain-text { padding: 12px 10px; background: #1e293b; color: #94a3b8; font-size: 13px; display: flex; align-items: center; border-left: 1px solid #334155; white-space: nowrap; }
        
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 14px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 13px; }
        button:hover { background: #0ea5e9; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-row button { flex: 1; border-radius: 8px; }
        .btn-refresh { background: #10b981; color: #fff; }
        .btn-refresh:hover { background: #059669; }
        .btn-random { background: #6366f1; color: #fff; }
        .btn-random:hover { background: #4f46e5; }
        
        .inbox-section { background: #0f172a; border-radius: 10px; border: 1px solid #334155; padding: 12px; }
        .inbox-title { font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; font-weight: 600; }
        .messages-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message-item { background: #1e293b; padding: 12px; border-radius: 6px; border-left: 4px solid #38bdf8; }
        .message-subject { font-size: 14px; font-weight: bold; color: #f1f5f9; margin-bottom: 4px; }
        .message-snippet { font-size: 12px; color: #94a3b8; word-break: break-all; }
        .loading { text-align: center; color: #64748b; padding: 20px; font-size: 13px; }
    </style>
</head>
<body>

    <!-- কন্টেইনারের বাইরে উপরে অ্যাড ব্যানার -->
    <div class="top-ad-wrapper">
        <script>
          atOptions = {
            'key' : '316a45d44eadc54b4a68c70d595c03bb',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/316a45d44eadc54b4a68c70d595c03bb/invoke.js"></script>
    </div>

<div class="container">
    <h1>BS Bhai Mail</h1>
    
    <div class="input-group">
        <label>আপনার টেম্পোরারি ইমেল অ্যাড্রেস:</label>
        <div class="email-box">
            <input type="text" id="usernameInput" placeholder="username">
            <div class="domain-text">@kinkbss.abrdns.com</div>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn-random" onclick="generateNewRandom()">রেন্ডম তৈরি</button>
        <button onclick="copyEmail()">কপি করুন</button>
        <button class="btn-refresh" onclick="fetchInbox()">ইনবক্স চেক</button>
    </div>

    <div class="inbox-section">
        <div class="inbox-title">
            <span>ইনবক্স বার্তা ও ওটিপি</span>
            <span style="font-size: 10px; color: #10b981;">● লাইভ</span>
        </div>
        
        <div class="messages-list" id="inboxList">
            <div class="loading">মেইল লোড হচ্ছে...</div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "tm_live_c145fed9cfaed40516bf721106d832cc24382558c76587627926c706eea0576c";
    const DOMAIN = "kinkbss.abrdns.com";
    let lastEmail = "";

    function getRandomString(length = 7) {
        const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
        let res = "";
        for(let i=0; i<length; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
        return res;
    }

    function getFullEmail() {
        const user = document.getElementById("usernameInput").value.trim() || "user";
        return `${user}@${DOMAIN}`;
    }

    function generateNewRandom() {
        document.getElementById("usernameInput").value = getRandomString();
        fetchInbox();
    }

    function copyEmail() {
        const email = getFullEmail();
        navigator.clipboard.writeText(email).then(() => {
            alert("কপি সফল হয়েছে: " + email);
        });
    }

    async function fetchInbox() {
        const email = getFullEmail();
        const inboxList = document.getElementById("inboxList");
        
        if (lastEmail !== email) {
            lastEmail = email;
            inboxList.innerHTML = '<div class="loading">ইনবক্স লোড হচ্ছে...</div>';
        }

        try {
            const targetUrl = `https://api.mail.cx/v1/inbox/${email}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

            let response = await fetch(targetUrl, {
                method: "GET",
                headers: {
                    "x-api-token": API_KEY,
                    "Accept": "application/json"
                }
            }).catch(() => null);

            if (!response || !response.ok) {
                response = await fetch(proxyUrl);
            }

            if (!response.ok) throw new Error("API Error");

            const data = await response.json();

            if (data.emails && data.emails.length > 0) {
                inboxList.innerHTML = "";
                
                data.emails.forEach(msg => {
                    const msgDiv = document.createElement("div");
                    msgDiv.className = "message-item";
                    msgDiv.innerHTML = `
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:3px;">প্রেরক: ${msg.from_email || 'অজানা'}</div>
                        <div class="message-subject">${msg.subject || 'কোন বিষয় নেই'}</div>
                        <div class="message-snippet">${msg.preview_text || msg.body || 'কোন টেক্সট নেই'}</div>
                    `;
                    inboxList.appendChild(msgDiv);
                });
            } else {
                inboxList.innerHTML = '<div class="loading">কোনো নতুন বার্তা বা ওটিপি আসেনি। অপেক্ষা করা হচ্ছে...</div>';
            }

        } catch (err) {
            console.error(err);
            inboxList.innerHTML = '<div class="loading" style="color:#38bdf8;">মেইল বক্স প্রস্তুত। যেকোনো সাইট থেকে কোড পাঠান।</div>';
        }
    }

    window.onload = function() {
        document.getElementById("usernameInput").value = getRandomString(8);
        lastEmail = getFullEmail();
        fetchInbox();
        setInterval(fetchInbox, 6000);
    };

    document.getElementById("usernameInput").addEventListener("input", function() {
        fetchInbox();
    });
</script>

</body>
</html>
